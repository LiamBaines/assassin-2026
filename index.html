<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assassin Briefing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  font-family: 'Orbitron', monospace;
  color: #EF5A98;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.terminal {
  border: 2px solid #EF5A98;
  padding: 2rem;
  text-align: center;
  box-shadow: 0 0 20px #EF5A98;
  max-width: 600px;
  width: 90%;
  min-height: 220px;
  border-radius: 12px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-size: 2rem;
  margin: 0;
  word-break: break-word;
}

p {
  font-size: 1.5rem;
  margin: 1rem 0 0 0;
  word-break: break-word;
}

button {
  font-family: 'Orbitron', monospace;
  font-size: 1.5rem; /* full size to match final text */
  color: #EF5A98;
  background: black;
  border: 2px solid #EF5A98;
  border-radius: 6px;
  padding: 0.5rem 1rem; /* comfortable size */
  cursor: pointer;
}

button:hover { background: #EF5A98; color: black; }

#error { margin-top: 1rem; }
</style>
</head>

<body>

<div class="terminal">
    <h1 id="greeting"></h1>
    <div id="idContainer"></div>
    <p id="error"></p>
</div>

<script>
function setVh() { document.body.style.height = window.innerHeight + 'px'; }
window.addEventListener('resize', setVh);
setVh();

function decodeBase64Json(b64) {
  try {
    const json = decodeURIComponent(
      atob(b64).split("").map(c => "%" + c.charCodeAt(0).toString(16).padStart(2,"0")).join("")
    );
    return JSON.parse(json);
  } catch { return null; }
}

const params = new URLSearchParams(window.location.search);
const dataParam = params.get("data");
const versionParam = params.get("version");

const g = document.getElementById("greeting");
const idContainer = document.getElementById("idContainer");
const err = document.getElementById("error");

/* VERSION GATE */
if (versionParam !== "3") {
  g.innerText = "Black Card offline";
  idContainer.style.display = "none";
  err.style.display = "none";
}

/* VERSION 3 LOGIC */
else if (!dataParam) {
  g.innerText = "INVALID BRIEFING";
  err.innerText = "Missing data parameter.";
}
else {
  const decoded = decodeBase64Json(dataParam);
  const validId = decoded && typeof decoded.id === "string";

    console.log(decoded)
    console.log(decoded.assassin)
    console.log(validId)
  if (!decoded || !decoded.assassin || !validId) {
    g.innerText = "CORRUPTED BRIEFING";
    err.innerText = "Data could not be decoded.";
  }
  else {
    g.innerText = `Hello ${decoded.assassin}.`;
    err.style.display = "none";

    // create button
    const btn = document.createElement("button");
    btn.textContent = "Reveal assassin ID";
    btn.addEventListener("click", () => {
      const p = document.createElement("p");
      p.style.fontSize = "1.5rem"; // ensure full size
      p.textContent = `Assassin ID: ${decoded.id}`;
      idContainer.innerHTML = "";
      idContainer.appendChild(p);
    });

    idContainer.appendChild(btn);
  }
}
</script>

</body>
</html>
